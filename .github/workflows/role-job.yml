# One reusable workflow for every unattended role job in the org.
#
# The split into two jobs is the whole security model, and it is the same one
# the review gate uses. `propose` runs the model with read scopes only —
# contents/issues/pull-requests at `read`, `actions: read`, and the
# `id-token: write` the action needs to mint its OIDC token, which grants
# nothing in the repository. No scope in that job can write an issue, a pull
# request or a file, so a role cannot post, label or close anything even if its
# prompt is subverted — not because it was told not to, but because the token
# cannot. It emits JSON. `apply` has the write scopes and no model in it, and
# enforces the caps in roles/registry.json before touching anything.
#
# The corollary, learned the hard way: no PAT is exported into `propose`. A
# `permissions:` block bounds GITHUB_TOKEN and nothing else, so a token handed
# to the model through `secrets:` is a write path around every boundary in
# apply.sh. Cross-repo reads arrive as JSON from `fetch.sh`, which runs before
# the model and holds the credential the model never sees.
#
# Everything about a job — which role, which brief, which model, how many turns,
# how many comments it may leave — comes from the registry, resolved by
# compose.sh. The caller passes an id. That keeps blast radius in a reviewed
# diff instead of in a workflow argument.
#
# roles_ref defaults to main for the same reason gate_ref does: a change to a
# charter is never executed by its own edited copy.
name: role-job

on:
  workflow_call:
    inputs:
      job:
        description: A job id from roles/registry.json.
        type: string
        required: true
      issue:
        description: Issue number, for event-driven jobs like intake.
        type: string
        required: false
        default: ''
      escalation_issue:
        description: Standing issue that receives escalations with no issue of their own.
        type: string
        required: false
        default: ''
      report_issue:
        description: Standing issue that the cron reporters comment on. Required by any job whose registry scope is report-issue.
        type: string
        required: false
        default: ''
      roles_ref:
        description: Ref of konyklabs/.github to load charters and scripts from.
        type: string
        required: false
        default: main
      stage:
        description: Print the writes instead of making them. Use for a first run.
        type: boolean
        required: false
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # Read scopes only. No write scope anywhere — that is the point of this job
  # existing separately from `apply`.
  #
  # `issues: read` and `pull-requests: read` are load-bearing and were missing
  # in the first revision. A `permissions:` block sets every unlisted scope to
  # `none`, so every `gh issue list` in every charter returned 403, the model
  # truthfully proposed nothing, and an empty proposal is what a healthy backlog
  # also looks like. The `surveyed` block in the schema is the second half of
  # that fix: apply.sh refuses a run that read zero items, so the blind case
  # fails loudly even if a scope goes missing again.
  #
  # GITHUB_TOKEN is scoped to THIS repository, and delivery-manager and
  # architect read across the org. The obvious fix — exporting ROLE_READ_TOKEN
  # as GH_TOKEN for the model — was tried and is wrong: a `permissions:` block
  # bounds GITHUB_TOKEN and nothing else, so a PAT handed to the model is a
  # write path around every boundary in apply.sh. `fetch.sh` runs first, with no
  # model, and leaves JSON on disk. The model reads files. It never holds the
  # token. Without ROLE_READ_TOKEN the context says single-repo and the roles
  # must say so in `surveyed` rather than report a smaller org.
  # ---------------------------------------------------------------------------
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check out charters, briefs and scripts
        uses: actions/checkout@v6
        with:
          repository: konyklabs/.github
          ref: ${{ inputs.roles_ref }}
          path: .roles
          fetch-depth: 1

      - id: compose
        name: Compose the role prompt
        env:
          JOB: ${{ inputs.job }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          REPORT_ISSUE: ${{ inputs.report_issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .roles/roles/bin/compose.sh

      # Only for jobs the registry marks `context: org`. po-intake reads an
      # issue body a stranger wrote; handing that job the whole org's private
      # issue titles and then relying on a prompt not to repeat them is not a
      # boundary. The data is simply not fetched into its workspace.
      - name: Fetch cross-repo context (no model runs here)
        if: steps.compose.outputs.context == 'org'
        env:
          ORG: ${{ github.repository_owner }}
          ROLE_READ_TOKEN: ${{ secrets.ROLE_READ_TOKEN }}
          OUT: .roles-context
        run: bash .roles/roles/bin/fetch.sh

      - id: run
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.compose.outputs.prompt }}
          claude_args: |
            --model ${{ steps.compose.outputs.model }}
            --effort ${{ steps.compose.outputs.effort }}
            --max-turns ${{ steps.compose.outputs.max_turns }}
            --json-schema '${{ steps.compose.outputs.schema }}'
            --allowedTools "Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh run list:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"

      - name: Keep the proposal
        env:
          RAW: ${{ steps.run.outputs.structured_output }}
        run: |
          mkdir -p out
          if [ -z "$RAW" ]; then
            echo "::error::${{ inputs.job }} produced no structured output. Re-run; this is not a clean backlog."
            exit 1
          fi
          printf '%s' "$RAW" >out/proposal.json
          jq -r '.summary' out/proposal.json >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: proposal-${{ inputs.job }}
          path: out/proposal.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Write scopes, no model. Caps come from the registry, not from the proposal.
  # ---------------------------------------------------------------------------
  apply:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out scripts
        uses: actions/checkout@v6
        with:
          repository: konyklabs/.github
          ref: ${{ inputs.roles_ref }}
          path: .roles
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: proposal-${{ inputs.job }}
          path: out

      - name: Apply the proposal
        env:
          # GITHUB_TOKEN, bounded by this job's permissions block, for every
          # issue and pull-request write. The Project v2 PAT is passed
          # SEPARATELY and used only by project-field.sh: setting it as GH_TOKEN
          # here would put all seven write arms outside the permissions block,
          # and would post every role comment under a human's identity instead
          # of github-actions[bot] — the exact attribution break this design
          # rejects Routines for.
          GH_TOKEN: ${{ github.token }}
          ROLE_PROJECT_TOKEN: ${{ secrets.ROLE_PROJECT_TOKEN }}
          JOB: ${{ inputs.job }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          REPORT_ISSUE: ${{ inputs.report_issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ESCALATION_ISSUE: ${{ inputs.escalation_issue }}
          ROLE_PROJECT_ID: ${{ vars.ROLE_PROJECT_ID }}
          ROLE_STAGE: ${{ inputs.stage }}
        run: |
          RAW=$(cat out/proposal.json) bash .roles/roles/bin/apply.sh
